name: CI

# Lints, builds the app and runs the Swift package test suites on every pull request to main,
# and on pushes to main, so a contributor sees a green or red check
# before anyone reviews the change. The XCUITest suites run nightly and on demand instead
# (ui-tests.yml).

on:
  # No branch filter, so a pull request stacked on another branch gets its checks too, and still
  # has them once retargeted to main. No "edited" or "labeled": editing a title or adding any label
  # reran everything and cancelled the run in progress, and a run that skipped itself instead
  # would report the required check as passed.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its older run; runs on main always finish, so each one
# saves its DerivedData cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything that can change a build or a test changed, and for which platform
  # (Scripts/ci-platforms.py). A change to docs, screenshots, store text or issue templates skips
  # every macOS job. On a pull request, scripts checked here in the Changes job build nothing, one
  # made only of files wrapped in `#if os(macOS)` skips the iPhone jobs, and one only of
  # `#if os(iOS)` files skips the Mac jobs. Pushes to main build everything but docs. A job skipped
  # by its condition reports success, so the required check still passes (a workflow level paths
  # filter would leave it pending).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ios: ${{ steps.diff.outputs.ios }}
      mac: ${{ steps.diff.outputs.mac }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tests are deterministic
        run: |
          python3 Scripts/test_check_test_determinism.py
          python3 Scripts/check-test-determinism.py

      - name: Check the house rules on the branch
        run: |
          python3 Scripts/test_check_house_rules.py
          python3 Scripts/check-house-rules.py --base origin/main

      - name: Self check the platform filter
        run: python3 Scripts/test_ci_platforms.py

      - name: Self check the file times, dependency pin and UI test scripts
        run: |
          python3 Scripts/test_ci_restore_mtimes.py
          python3 Scripts/test_sync_package_pins.py
          python3 Scripts/test_ci_ui_tests.py

      # Their scripts never build, so a change to them alone skips the macOS jobs: check them here.
      - name: Self check the changelog and localization scripts
        run: |
          python3 Scripts/test_gen_changelog.py
          python3 Scripts/test_gen_l10n.py

      - name: Compare
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) BASE="${BASE_SHA}" ;;
            push) BASE="${BEFORE_SHA}" ;;
            *) BASE="" ;;
          esac
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No base to compare against; running everything"
            printf 'code=true\nios=true\nmac=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          CHANGED=$(git -c core.quotePath=false diff --name-only "${BASE}" "${GITHUB_SHA}")
          echo "Changed files:"
          echo "${CHANGED}"
          OUTPUTS=$(echo "${CHANGED}" | python3 Scripts/ci-platforms.py --ref "${GITHUB_SHA}" --event "${EVENT}")
          echo "${OUTPUTS}"
          echo "${OUTPUTS}" >> "${GITHUB_OUTPUT}"

  build-and-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # GitHub's Xcode 27 image (macOS 27): matches local development and builds TCA's macros with
    # Apple's prebuilt swift-syntax instead of compiling it on every run.
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      SIM_DEVICE: iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for the commit times below.
          fetch-depth: 0

      # Xcode decides what to recompile from modification times; a fresh checkout stamps every
      # file with the clone time, which made the cached DerivedData recompile every package.
      - name: Restore file times
        run: python3 Scripts/ci-restore-mtimes.py

      # One DerivedData and one SwiftPM checkout folder shared by every build in the job, so each
      # dependency compiles once; DerivedData is also cached between runs (saved from main,
      # restored everywhere). Both sit in runner.temp, outside the repo so the linters never scan
      # them: actions/cache rejects paths containing "..", and runner.temp only exists inside steps.
      - name: Set build folders
        run: |
          echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData" >> "${GITHUB_ENV}"
          echo "SPM_CHECKOUTS=${RUNNER_TEMP}/SourcePackages" >> "${GITHUB_ENV}"

      # Lint shares this job instead of queueing for a second macOS runner. The versions are pinned
      # once, in the shared action the format bot uses too.
      - name: Install SwiftFormat and SwiftLint
        uses: ./.github/actions/install-lint-tools

      - name: SwiftFormat (check only)
        run: swiftformat . --lint

      - name: SwiftLint
        run: swiftlint lint --quiet

      - name: Dependency pins match the app
        run: python3 Scripts/sync-package-pins.py --check

      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPM_CHECKOUTS }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # CI stays on Xcode 27.1 (27A9275); 27.2 locally only adds device symbols for iOS 27.2.
      # Build output from the latest main run: only what changed recompiles. Keyed on the Xcode
      # build and the resolved dependencies; restore keys fall back to the closest older entry.
      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
            !${{ env.DERIVED_DATA }}/Index.noindex
          key: deriveddata-xcode27.1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-xcode27.1-${{ hashFiles('**/Package.resolved') }}-
            deriveddata-xcode27.1-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "Available simulator runtimes:"
          xcrun simctl list runtimes | grep -i ios || true

      # The Composable Architecture and its dependencies ship Swift macros. On a fresh CI
      # machine xcodebuild refuses to run an unvalidated macro ("must be enabled before it
      # can be used"); this opts out of the interactive fingerprint prompt.
      - name: Trust Swift package macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # Every package's tests in one build and one run, through the PackageTests scheme of the
      # CI only PackageTests.xcworkspace (local packages only expose their test targets to a
      # scheme inside a workspace). Keychain is left out: its tests hit the real Security
      # framework, which returns errSecMissingEntitlement (-34018) without an entitled app host,
      # so they run locally. Coverage is off; it only made the test host spam
      # "Failed to write file default.profraw".
      #
      # Every xcodebuild here builds the same way, so the cached DerivedData and the next build
      # reuse each other instead of recompiling every module:
      # * the PackageTests workspace, which also holds the app project: a module built through a
      #   project gets a different -working-directory than through a workspace, and that alone
      #   recompiles it;
      # * -onlyUsePackageVersionsFromResolvedFile: the shared checkouts made the app re-resolve
      #   after the packages and move swift-collections to a newer version than Package.resolved
      #   pins, recompiling everything built on it, and building against a version the app does
      #   not ship;
      # * no coverage instrumentation (the app scheme turns it on by default).
      - name: Test packages
        run: |
          xcodebuild test \
            -workspace PackageTests.xcworkspace \
            -scheme PackageTests \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage NO

      # Runs after the package tests, on the same DerivedData, destination and workspace, so it
      # reuses every module they compiled and only builds the app target.
      - name: Build app
        run: |
          xcodebuild build \
            -workspace PackageTests.xcworkspace \
            -scheme NextExplorer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            -onlyUsePackageVersionsFromResolvedFile \
            CLANG_COVERAGE_MAPPING=NO \
            CODE_SIGNING_ALLOWED=NO

      # Only main saves: GitHub scopes a pull request's cache to that pull request, so a save
      # there helps nobody else, and main's copy is what every pull request restores.
      - name: Save SwiftPM checkouts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SPM_CHECKOUTS }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      - name: Save DerivedData
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
            !${{ env.DERIVED_DATA }}/Index.noindex
          key: deriveddata-xcode27.1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}

  # The Mac side of every change, beside the iPhone checks rather than after them.
  mac-build-and-test:
    name: Mac build and test
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for the commit times below.
          fetch-depth: 0

      # Xcode decides what to recompile from modification times; a fresh checkout stamps every
      # file with the clone time, which made the cached DerivedData recompile every package.
      - name: Restore file times
        run: python3 Scripts/ci-restore-mtimes.py

      - name: Set build folders
        run: |
          echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData" >> "${GITHUB_ENV}"
          echo "SPM_CHECKOUTS=${RUNNER_TEMP}/SourcePackages" >> "${GITHUB_ENV}"

      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPM_CHECKOUTS }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The Mac build output has its own cache: the iPhone one holds simulator products only.
      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
            !${{ env.DERIVED_DATA }}/Index.noindex
          key: deriveddata-mac-xcode27.1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-mac-xcode27.1-${{ hashFiles('**/Package.resolved') }}-
            deriveddata-mac-xcode27.1-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Trust Swift package macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # The package suites again on the Mac, for the macOS only code paths (Save panel
      # downloads, AppKit views). Packages first, for the same reason as in Build and test.
      - name: Test packages on macOS
        run: |
          xcodebuild test \
            -workspace PackageTests.xcworkspace \
            -scheme PackageTests \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage NO

      # The same target also ships as a native macOS app; build it so a change can't quietly
      # break the Mac side (every Mac difference sits behind #if os(macOS)). Release, as the Mac
      # App Store archive is: code that only compiles in Debug (a DEBUG gated helper used by a
      # #Preview, which Release still compiles) once broke only the release build.
      # Release has its own build folders, so it never shares objects with the Debug package tests;
      # strict pins keep it on the shipped dependency versions.
      - name: Build macOS app (Release)
        run: |
          xcodebuild build \
            -project NextExplorer.xcodeproj \
            -scheme NextExplorer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      - name: Save DerivedData
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
            !${{ env.DERIVED_DATA }}/Index.noindex
          key: deriveddata-mac-xcode27.1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
