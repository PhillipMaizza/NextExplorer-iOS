name: CI

# Lints, builds the app and runs the Swift package test suites on every pull request to main,
# and on pushes to main, so a contributor sees a green or red check
# before anyone reviews the change.
#
# The XCUITest suite is heavier (boots a simulator, cold launches the app per test) so it runs on
# pushes to main, on demand, and on pull requests labelled `ui-tests`.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Manual trigger so the heavier UI test job can be run on any branch on demand.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # GitHub's Xcode 27 image (macOS 27): matches local development and builds TCA's macros with
    # Apple's prebuilt swift-syntax instead of compiling it on every run.
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      SIM_DEVICE: iPhone 17
      # The package test runs share one DerivedData and one SwiftPM checkout folder, so TCA and
      # swift-syntax (its macros) compile once instead of once per package. Both live outside the
      # repo so the linters never scan them.
      DERIVED_DATA: ${{ github.workspace }}/../DerivedData
      SPM_CHECKOUTS: ${{ github.workspace }}/../SourcePackages
      # Package test suites, discovered under Packages/<name>/Tests.
      # Keychain is intentionally omitted: its tests hit the real Security framework, which
      # returns errSecMissingEntitlement (-34018) for a standalone SwiftPM test bundle on the
      # simulator (no app host / keychain-access-group entitlement). They pass only inside an
      # entitled app host, so they run locally in Xcode, not in this package-by-package CI.
      TEST_PACKAGES: >-
        CoreModels
        NetworkClient
        AuthClient
        FilesClient
        Localization
        DesignSystem
        AuthFeature
        FilesFeature
        AppStorageKeys
        AppFeature

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Lint shares this job instead of queueing for a second macOS runner. Pinned to the versions
      # used locally (release binaries, not Homebrew's latest), so a rule added upstream can't fail
      # CI on its own; bump these together with the local tools.
      - name: Install SwiftFormat and SwiftLint
        env:
          SWIFTFORMAT_VERSION: "0.63.0"
          SWIFTLINT_VERSION: "0.63.2"
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/lint-bin"
          mkdir -p "${BIN}"
          curl -sSfL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "${RUNNER_TEMP}/swiftformat.zip"
          curl -sSfL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o "${RUNNER_TEMP}/swiftlint.zip"
          unzip -o -q "${RUNNER_TEMP}/swiftformat.zip" -d "${BIN}"
          unzip -o -q "${RUNNER_TEMP}/swiftlint.zip" -d "${BIN}"
          chmod +x "${BIN}/swiftformat" "${BIN}/swiftlint"
          echo "${BIN}" >> "${GITHUB_PATH}"
          "${BIN}/swiftformat" --version
          "${BIN}/swiftlint" version

      - name: SwiftFormat (check only)
        run: swiftformat . --lint

      - name: SwiftLint
        run: swiftlint lint --quiet

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CHECKOUTS }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Same Xcode build as local development (27.1, 27A9275).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "Available simulator runtimes:"
          xcrun simctl list runtimes | grep -i ios || true

      # The Composable Architecture and its dependencies ship Swift macros. On a fresh CI
      # machine xcodebuild refuses to run an unvalidated macro ("must be enabled before it
      # can be used"); this opts out of the interactive fingerprint prompt.
      - name: Trust Swift package macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Test packages
        run: |
          set -o pipefail
          DEST="platform=iOS Simulator,name=${SIM_DEVICE},OS=latest"
          echo "Test destination: ${DEST}"
          FAIL=0
          for pkg in ${TEST_PACKAGES}; do
            echo "::group::Test ${pkg}"
            # Coverage is not collected in CI; disabling it stops the sandboxed test host
            # spamming "LLVM Profile Error: Failed to write file default.profraw".
            if ! ( cd "Packages/${pkg}" && xcodebuild test \
                -scheme "${pkg}" \
                -destination "${DEST}" \
                -derivedDataPath "${DERIVED_DATA}" \
                -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
                -enableCodeCoverage NO ); then
              echo "::error::${pkg} tests failed"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

      # Runs after the package tests, on the same DerivedData and destination, so it reuses the
      # dependencies they compiled instead of building them again. Packages first: a package that
      # resolves right after the app has resolved the shared checkouts can fail to resolve.
      - name: Build app
        run: |
          xcodebuild build \
            -project NextExplorer.xcodeproj \
            -scheme NextExplorer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            CODE_SIGNING_ALLOWED=NO

  ui-test:
    name: UI tests
    # Merges to main, manual runs from the Actions tab, and pull requests labelled `ui-tests`.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ui-tests'))
    # GitHub's Xcode 27 image (macOS 27): matches local development and builds TCA's macros with
    # Apple's prebuilt swift-syntax instead of compiling it on every run.
    runs-on: xcode-27
    # Headroom for the one automatic retry below: a simulator launch flake can hang the first
    # attempt for a while before it fails, so a retry must still fit inside the budget.
    timeout-minutes: 90

    env:
      SIM_DEVICE: iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Trust Swift package macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Resolve package dependencies
        run: |
          xcodebuild -project NextExplorer.xcodeproj \
            -scheme NextExplorer \
            -resolvePackageDependencies

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Boot simulator
        # Pin the destination to a concrete UDID and fully boot it before xcodebuild attaches.
        # The recurring CI failure was a cold launch race ("Failed to send signal 19 to process")
        # where xcodebuild could not SIGSTOP/resume the app on a not yet ready simulator; booting
        # first and waiting for bootstatus avoids it.
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available "${SIM_DEVICE}" \
            | grep -Eo '\(([0-9A-F-]{36})\)' | tr -d '()' | head -1 || true)
          if [ -z "${UDID}" ]; then
            echo "No available '${SIM_DEVICE}' simulator on this runner"; exit 1
          fi
          echo "SIM_UDID=${UDID}" >> "${GITHUB_ENV}"
          echo "Booting ${SIM_DEVICE} (${UDID})"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b

      - name: Run XCUITests
        # One automatic retry: the launch flake is transient, so a fresh reboot + rerun clears it
        # without masking a genuine test failure (a real failure fails both attempts). Output runs
        # through xcbeautify so a failing test surfaces as a GitHub annotation instead of a raw
        # xcodebuild dump, and the .xcresult is uploaded below for offline inspection.
        run: |
          set -o pipefail
          DEST="platform=iOS Simulator,id=${SIM_UDID}"
          echo "UI test destination: ${DEST}"
          run_tests() {
            rm -rf TestResults.xcresult
            xcodebuild test \
              -project NextExplorer.xcodeproj \
              -scheme NextExplorer \
              -destination "${DEST}" \
              -enableCodeCoverage NO \
              -resultBundlePath TestResults.xcresult \
              -only-testing:NextExplorerUITests \
              | xcbeautify --renderer github-actions
          }
          if ! run_tests; then
            echo "::warning::UI tests failed on the first attempt (often a simulator launch flake). Rebooting and retrying once."
            xcrun simctl shutdown "${SIM_UDID}" || true
            xcrun simctl boot "${SIM_UDID}" || true
            xcrun simctl bootstatus "${SIM_UDID}" -b || true
            run_tests
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-results
          path: TestResults.xcresult
          if-no-files-found: ignore
