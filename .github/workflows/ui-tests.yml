name: UI tests

# The XCUITest suites (iPhone on a simulator, and the Mac app) run nightly on main and on demand
# ("Run workflow" on any branch), not on pull requests. They cold launch the app per test, and a
# free macOS runner (three cores, no GPU for the simulator) runs them many times slower than a
# developer's Mac: they outgrew every time limit and shard split. Pull requests carry a local run
# of both suites instead (Scripts/run-ui-tests.sh).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# One run per branch at a time; a newer one waits rather than cancelling a long run near its end.
concurrency:
  group: ui-tests-${{ github.ref }}

jobs:
  # The iPhone UI tests, built on their own runner and handed to the job that runs them.
  ui-test-build:
    name: UI test build
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      SIM_DEVICE: iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for the commit times below.
          fetch-depth: 0

      # Xcode decides what to recompile from modification times; a fresh checkout stamps every
      # file with the clone time, which made the cached DerivedData recompile every package.
      - name: Restore file times
        run: python3 Scripts/ci-restore-mtimes.py

      - name: Set build folders
        run: |
          echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData" >> "${GITHUB_ENV}"
          echo "SPM_CHECKOUTS=${RUNNER_TEMP}/SourcePackages" >> "${GITHUB_ENV}"

      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPM_CHECKOUTS }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
            !${{ env.DERIVED_DATA }}/Index.noindex
          key: deriveddata-xcode27.1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-xcode27.1-${{ hashFiles('**/Package.resolved') }}-
            deriveddata-xcode27.1-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Trust Swift package macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # Built the same way as Build and test (workspace, strict pins, no coverage), so the cached
      # DerivedData from main covers everything but the UI test target.
      - name: Build UI tests
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -workspace PackageTests.xcworkspace \
            -scheme NextExplorer \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage NO
          # Only what the app's .xctestrun runs (it refers to them relative to itself), not the
          # debug symbols and package test bundles that make the folder about a gigabyte. The
          # cached folder also holds the PackageTests .xctestrun, so the name is matched exactly.
          cd "${DERIVED_DATA}/Build/Products"
          tar -czf "${RUNNER_TEMP}/ui-test-products.tgz" \
            ./NextExplorer_*iphonesimulator*.xctestrun \
            Debug-iphonesimulator/NextExplorer.app \
            Debug-iphonesimulator/NextExplorerUITests-Runner.app \
            Debug-iphonesimulator/PackageFrameworks
          ls -lh "${RUNNER_TEMP}/ui-test-products.tgz"

      - name: Upload UI test build
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-products
          path: ${{ runner.temp }}/ui-test-products.tgz
          retention-days: 1

  # The whole suite on one runner: nothing waits on it, so it takes as long as it needs instead of
  # being split by measured class times that drift every time a class grows.
  ui-test:
    name: UI tests
    needs: ui-test-build
    runs-on: xcode-27
    timeout-minutes: 240

    env:
      SIM_DEVICE: iPhone 17

    steps:
      # Only the scripts: this job runs a prebuilt test bundle.
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: Scripts

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Download UI test build
        uses: actions/download-artifact@v7
        with:
          name: ui-test-products
          path: ${{ runner.temp }}

      - name: Unpack UI test build
        run: |
          set -euo pipefail
          PRODUCTS="${RUNNER_TEMP}/Products"
          mkdir -p "${PRODUCTS}"
          tar -C "${PRODUCTS}" -xzf "${RUNNER_TEMP}/ui-test-products.tgz"
          XCTESTRUN=$(find "${PRODUCTS}" -maxdepth 1 -name 'NextExplorer_*iphonesimulator*.xctestrun' | head -1)
          if [ -z "${XCTESTRUN}" ]; then
            echo "No .xctestrun in the UI test build"; exit 1
          fi
          echo "XCTESTRUN=${XCTESTRUN}" >> "${GITHUB_ENV}"

      - name: Install xcbeautify
        run: brew install xcbeautify

      # Spotlight indexing competes with the simulator for the runner's three cores.
      - name: Turn off Spotlight
        run: sudo mdutil -a -i off

      - name: Boot simulator
        # After the download, not during it: on a runner's few cores a booting simulator slowed the
        # download and unpack by minutes. Pin the destination to a concrete UDID and fully boot it
        # before xcodebuild attaches.
        # The recurring CI failure was a cold launch race ("Failed to send signal 19 to process")
        # where xcodebuild could not SIGSTOP/resume the app on a not yet ready simulator; booting
        # first and waiting for bootstatus avoids it.
        run: |
          set -euo pipefail
          # Exact name on the newest iOS runtime: a plain name filter also matches "iPhone 17e".
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          name = os.environ["SIM_DEVICE"]
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), reverse=True)
          print(next((d["udid"] for r in runtimes for d in devices[r] if d["name"] == name), ""))
          ')
          if [ -z "${UDID}" ]; then
            echo "No available '${SIM_DEVICE}' simulator on this runner"; exit 1
          fi
          echo "SIM_UDID=${UDID}" >> "${GITHUB_ENV}"
          echo "Booting ${SIM_DEVICE} (${UDID})"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          # No "Save Password?" sheet after a sign in: inside the app it took the next tap, and on
          # the 2FA code page the number pad covered its Not Now button.
          xcrun simctl spawn "${UDID}" defaults write com.apple.WebUI AutoFillPasswords -bool NO

      - name: Run XCUITests
        # One simulator, no parallel clones: the scheme marks the UI tests parallelizable, which
        # suits a laptop, but clones on a runner's few cores timed out evaluating UI queries.
        # Scripts/ci-ui-tests.py reruns only the failed tests,
        # once, in a fresh test runner, and reports any test that passed only on that rerun as
        # flaky. Output runs through xcbeautify so a failing test surfaces as a GitHub annotation,
        # and the .xcresult bundles are uploaded below for offline inspection.
        run: |
          echo "UI test destination: platform=iOS Simulator,id=${SIM_UDID}"
          python3 Scripts/ci-ui-tests.py --result TestResults --select="-only-testing:NextExplorerUITests" -- \
            test-without-building \
            -xctestrun "${XCTESTRUN}" \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -parallel-testing-enabled NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uitest-results
          path: TestResults*.xcresult
          if-no-files-found: ignore

  mac-ui-test:
    name: Mac UI tests
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for the commit times below.
          fetch-depth: 0

      # Xcode decides what to recompile from modification times; a fresh checkout stamps every
      # file with the clone time, which made the cached DerivedData recompile every package.
      - name: Restore file times
        run: python3 Scripts/ci-restore-mtimes.py

      - name: Set build folders
        run: |
          echo "DERIVED_DATA=${RUNNER_TEMP}/DerivedData" >> "${GITHUB_ENV}"
          echo "SPM_CHECKOUTS=${RUNNER_TEMP}/SourcePackages" >> "${GITHUB_ENV}"

      - name: Restore SwiftPM checkouts
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPM_CHECKOUTS }}
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
            !${{ env.DERIVED_DATA }}/Index.noindex
          key: deriveddata-mac-xcode27.1-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            deriveddata-mac-xcode27.1-${{ hashFiles('**/Package.resolved') }}-
            deriveddata-mac-xcode27.1-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Trust Swift package macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # A Mac UI test drives the real app through accessibility, which macOS only allows once UI
      # automation is enabled for the session; a runner never shows the prompt to approve it.
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication

      - name: Turn off Spotlight
        run: sudo mdutil -a -i off

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run Mac XCUITests
        # Through the PackageTests workspace with strict pins, like the Mac package tests, so it
        # reuses their Debug modules from the cache. Failed tests rerun once on their own, and
        # flaky ones are reported, as in the iPhone job (xcodebuild's own retry reran all 30
        # tests after one failure).
        # Ad hoc signed: the app and its test runner only need to launch on this runner. No
        # entitlements file: its App Group and keychain groups need a provisioning profile, and
        # macOS refuses to launch an ad hoc app that claims them. The sandbox still comes from the
        # build settings.
        run: |
          python3 Scripts/ci-ui-tests.py --result MacTestResults \
            --select="-only-testing:NextExplorerUITests" -- \
            test \
            -workspace PackageTests.xcworkspace \
            -scheme NextExplorer \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${SPM_CHECKOUTS}" \
            -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS=

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-uitest-results
          path: MacTestResults*.xcresult
          if-no-files-found: ignore
